# Builds the desktop apps (Linux, Windows), the Android app and the standalone Node server.
# - Every push / pull request: build and keep the files as workflow artifacts.
# - Push to dev: also publish them as the rolling "dev" pre-release (version X.Y.Z-dev.<run>).
# - A version tag (vX.Y.Z, from main): publish them as a stable GitHub release.
# Versions: scripts/ci-version.mjs. Branches and releases: docs/releases.md.
name: Build

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Check web modules
        run: find web -name '*.js' -print0 | xargs -0 -n1 node --check

  server:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/ci-version.mjs
      - run: npm run dist:server
      - name: Zip
        run: |
          cd release
          zip -qr "repronote-server-v$REPRONOTE_VERSION.zip" repronote-server
      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: release/repronote-server-*.zip

  desktop:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            files: |
              release/*.AppImage
              release/*.deb
              release/*.tar.gz
          - os: windows-latest
            target: win
            files: release/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/ci-version.mjs
        shell: bash
      - run: npm run dist:${{ matrix.target }}
        env:
          # No code signing yet: Windows will show a SmartScreen warning.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: ${{ matrix.files }}

  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: node scripts/ci-version.mjs
      - run: npm run build
      - name: Signing key (optional, from repository secrets)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Build APKs
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION=$(node -p "require('../package.json').version")
          ./gradlew assembleRelease --no-daemon -PversionName="$VERSION" -PversionCode="${{ github.run_number }}"
          mkdir -p ../release
          for f in app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$f" .apk | sed -E 's/^app-(.*)-release(-unsigned)?$/\1/')
            cp "$f" "../release/repronote-$VERSION-android-$abi.apk"
          done
          ls -la ../release
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: release/*.apk

  # Installs the x86_64 APK on an emulator and checks the app starts its server and UI.
  android-smoke:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r apk/*-android-x86_64.apk
            adb shell am start -W -n io.github.ancarsenat.repronote/.MainActivity
            for i in $(seq 1 60); do adb logcat -d -s repronote-node:* | grep -q "Pronote UI" && break; sleep 2; done
            adb logcat -d -s repronote-node:* repronote:*
            adb logcat -d -s repronote-node:* | grep -q "Pronote UI"
            sleep 5
            adb exec-out screencap -p > screen.png
            node scripts/android-login-test.mjs
            adb exec-out screencap -p > login.png
            for i in $(seq 1 45); do adb logcat -d -s repronote-node:* | grep -q "\[sync\]" && break; sleep 2; done
            adb exec-out screencap -p > login2.png
            adb logcat -d -s repronote-node:* repronote:* chromium:* > logcat.txt || true
            grep -v glBindAttrib logcat.txt | tail -80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-screenshot
          path: |
            screen.png
            login.png
            login2.png
            logcat.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [server, desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: install-linux.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            artifacts/*
            install-linux.sh
          generate_release_notes: true

  # Push to dev: replace the rolling "dev" pre-release (tag "dev" moved to this commit).
  release-dev:
    if: github.ref == 'refs/heads/dev'
    needs: [server, desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish the dev pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node scripts/ci-version.mjs | sed -n 's/^REPRONOTE_VERSION=//p')
          gh release delete dev --cleanup-tag --yes || true
          git push origin :refs/tags/dev || true
          gh release create dev artifacts/* install-linux.sh \
            --prerelease --target "$GITHUB_SHA" --title "Dev $VERSION" \
            --notes "Version de développement $VERSION (branche dev, commit ${GITHUB_SHA::7}), reconstruite à chaque modification. Peut être instable : la version stable est la dernière release normale."
