plugins {
    id "com.android.application"
}

// The embedded Node runtime (nodejs-mobile) is downloaded once into libnode/
// instead of being committed (it is ~250 MB for all ABIs).
def nodeMobileVersion = "18.20.4"
def libnodeDir = file("libnode")

tasks.register("downloadLibnode") {
    outputs.dir(libnodeDir)
    onlyIf { !file("libnode/include/node/node.h").exists() }
    doLast {
        def zip = new File(temporaryDir, "nodejs-mobile.zip")
        ant.get(src: "https://github.com/nodejs-mobile/nodejs-mobile/releases/download/v${nodeMobileVersion}/nodejs-mobile-v${nodeMobileVersion}-android.zip", dest: zip)
        copy {
            from zipTree(zip)
            into libnodeDir
        }
    }
}

// The backend (dist/android.mjs, built by `npm run build`) and the web UI go in
// the APK assets; the app copies them to its files directory and runs them.
tasks.register("copyNodeProject", Sync) {
    from("../../dist") { include "android.mjs"; into "dist" }
    from("../../web") { into "web" }
    into "src/main/assets/nodejs-project"
    doFirst {
        if (!file("../../dist/android.mjs").exists()) throw new GradleException("Run `npm run build` first (dist/android.mjs is missing).")
    }
}

android {
    namespace "io.github.ancarsenat.repronote"
    compileSdk 35
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "io.github.ancarsenat.repronote"
        minSdk 24
        targetSdk 35
        versionCode((project.findProperty("versionCode") ?: "1") as int)
        versionName(project.findProperty("versionName") ?: "0.1.0")
        externalNativeBuild {
            cmake { arguments "-DANDROID_STL=c++_shared" }
        }
    }

    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "armeabi-v7a", "x86_64"
            universalApk false
        }
    }

    sourceSets {
        main { jniLibs.srcDirs = ["libnode/bin"] }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    // Release builds are signed with the key given in the environment (CI
    // secrets); without one they fall back to the debug key so they still install.
    signingConfigs {
        release {
            def ks = System.getenv("ANDROID_KEYSTORE")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv("ANDROID_KEYSTORE") ? signingConfigs.release : signingConfigs.debug
        }
    }

    packaging {
        jniLibs { useLegacyPackaging true }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

preBuild.dependsOn("downloadLibnode", "copyNodeProject")
tasks.matching { it.name.startsWith("configureCMake") || it.name.startsWith("buildCMake") }.configureEach { dependsOn "downloadLibnode" }
